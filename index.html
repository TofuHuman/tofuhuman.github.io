<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>beats and all</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Merriweather&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      font-family: 'Merriweather', serif;
      display: flex;
      overflow: hidden;
    }

    .left {
      background: white;
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .left h1 {
      font-weight: 700;
      font-size: 4rem;
      text-transform: lowercase;
      color: #2e7d32; /* forest green */
      letter-spacing: 0.1em;
    }

    .right {
      flex: 1;
      background: url('https://github.com/tofuhuman/tofuhuman.github.io/blob/main/nature.jpg?raw=true') no-repeat center center;
      background-size: cover;
    }

    /* Responsive for smaller screens */
    @media (max-width: 768px) {
      body, html {
        flex-direction: column;
      }
      .left, .right {
        flex: none;
        height: 50vh;
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="left">
    <h1>beats and all</h1>
  </div>
  <div class="right"></div>
</body>
</html>
