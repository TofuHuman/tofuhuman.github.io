<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>beats and all</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      font-family: 'Playfair Display', serif;
      display: flex;
      overflow: hidden;
      background: white;
    }

    .left {
      background: white;
      flex: 1 1 40%; /* allow flex grow, shrink, and start at 40% */
      min-width: 320px; /* don’t get too narrow */
      max-width: 600px; /* max size for large screens */
      padding: 60px 40px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }

    .left h1 {
      font-weight: 400;
      font-size: clamp(2rem, 5vw, 3.5rem); /* fluid font size */
      text-transform: lowercase;
      color: #2e7d32;
      letter-spacing: 0.1em;
      max-width: 80%;
    }

    .right {
      flex: 1 1 60%;
      min-width: 300px;
      background: url('https://github.com/tofuhuman/tofuhuman.github.io/blob/main/little-flower-niagara.jpg?raw=true') no-repeat center center;
      background-size: cover;
    }

    /* Responsive adjustments */
    @media (max-width: 900px) {
      body, html {
        flex-direction: column;
      }
      .left, .right {
        max-width: 100%;
        min-width: 100%;
        flex: none;
        height: 50vh;
        padding: 30px 20px;
      }
      .left h1 {
        max-width: 100%;
        font-size: clamp(1.5rem, 8vw, 3rem);
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <div class="left">
    <h1>beats and all</h1>
  </div>
  <div class="right"></div>
</body>
</html>
